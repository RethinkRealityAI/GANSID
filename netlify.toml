# Next.js on Netlify's Next.js runtime (detected automatically). The site is no longer a static
# export: the CMS admin (/admin), previews and form APIs run as server functions, while public
# pages are cached and refreshed when editors publish.
[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

# Production and branch deploys apply pending CMS database migrations before building.
# They only ever add to the separate "payload" schema; Congress tables are untouched.
# Deploy previews (PRs) build only and never change the database.
[context.production]
  command = "npm run migrate && npm run build"

[context.branch-deploy]
  command = "npm run migrate && npm run build"

# Old WordPress URLs keep working while pages move. Add a line per moved page
# (CMS-managed redirects will replace this list later).
# [[redirects]]
#   from = "/about-the-gansid"
#   to = "/about/"
#   status = 301
